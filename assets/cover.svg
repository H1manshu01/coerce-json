<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- background -->
  <rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="4" fill="#7ee787"/>

  <!-- left column -->
  <text x="56" y="150" font-size="54" font-weight="700" fill="#e6edf3">coerce<tspan fill="#7ee787">-json</tspan></text>
  <text x="58" y="192" font-size="18" fill="#c9d1d9">Repair &amp; coerce LLM JSON to your schema</text>
  <text x="58" y="222" font-size="15" fill="#8b949e">every fix logged · never fabricates data</text>

  <!-- feature chips -->
  <g font-size="15" fill="#c9d1d9">
    <rect x="56" y="256" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="131" y="278" text-anchor="middle">zero-dependency</text>
    <rect x="216" y="256" width="184" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="308" y="278" text-anchor="middle">Zod + JSON Schema</text>
    <rect x="410" y="256" width="96" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="458" y="278" text-anchor="middle">~3.6 kB</text>
  </g>

  <!-- install line -->
  <text x="58" y="344" font-size="18"><tspan fill="#7ee787">$</tspan> <tspan fill="#c9d1d9">npm install coerce-json</tspan></text>

  <!-- terminal card (right) -->
  <rect x="512" y="56" width="432" height="308" rx="12" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="512" y="56" width="432" height="38" rx="12" fill="#161b22"/>
  <rect x="512" y="82" width="432" height="12" fill="#161b22"/>
  <circle cx="534" cy="75" r="5.5" fill="#ff5f56"/>
  <circle cx="553" cy="75" r="5.5" fill="#ffbd2e"/>
  <circle cx="572" cy="75" r="5.5" fill="#27c93f"/>
  <text x="728" y="80" text-anchor="middle" font-size="12" fill="#8b949e">coerce(raw, schema)</text>

  <!-- body: before → after → changes -->
  <text x="532" y="130" font-size="13" fill="#6e7681">// almost-valid model output</text>
  <text x="532" y="160" font-size="15"><tspan fill="#8b949e">{ </tspan><tspan fill="#7ee787">"id"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"42"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#7ee787">"active"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"true"</tspan><tspan fill="#8b949e"> }</tspan></text>
  <text x="532" y="198" font-size="15" fill="#7ee787">↓  coerce(raw, schema)</text>
  <text x="532" y="236" font-size="15"><tspan fill="#8b949e">{ </tspan><tspan fill="#c9d1d9">id</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#ffa657">42</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#c9d1d9">active</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#d2a8ff">true</tspan><tspan fill="#8b949e"> }</tspan></text>
  <text x="532" y="272" font-size="13"><tspan fill="#8b949e">changes: </tspan><tspan fill="#c9d1d9">string→number, string→boolean</tspan></text>
  <text x="532" y="298" font-size="13"><tspan fill="#27c93f">✓ ok</tspan><tspan fill="#6e7681">  — every fix logged</tspan></text>
</svg>
